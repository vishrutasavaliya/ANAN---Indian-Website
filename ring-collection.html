<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Rings and Collections | ANAN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="logo" href="index.html" aria-label="ANAN home">
            <img src="Feature%20Images/logo_black.png" alt="">
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="alpha-collection.html">Alpha</a>
            <a href="collections.html">Collections</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="section-container collection-page local-collection-page vertical-collection-page">
        <div class="collection-actions">
            <a class="collection-action collection-back" href="index.html">← Back to Home</a>
            <a class="collection-action collection-enquiry-link" href="contact.html">Enquire Now</a>
        </div>
        <h1 class="section-title" id="ring-title">RINGS AND COLLECTIONS</h1>
        <p class="collection-intro">Discover the ring collection that speaks to you.</p>

        <nav class="ring-filters" aria-label="Filter ring collection">
            <a href="ring-collection.html" data-ring-filter="all">All Rings</a>
            <a href="ring-collection.html?category=color" data-ring-filter="color">Color Rings</a>
            <a href="ring-collection.html?category=cst" data-ring-filter="cst">CST Rings</a>
            <a href="ring-collection.html?category=white" data-ring-filter="white">White Rings</a>
        </nav>

        <section class="collection-carousel" aria-label="Ring gallery">
            <div class="gallery-viewport">
                <div class="gallery-track" id="ring-gallery"></div>
            </div>
        </section>
    </main>

    <script>
        const ringCollections = {
            color: [
                'AIR-29.JPG', 'AIR-31.JPG', 'AJR-5931 (2).JPG', 'AJR-7518.5.JPG',
                'AJR-7557.1.JPG', 'AJR-9003.3.JPG', 'AJR-9067.1 (2).JPG', 'AJR-9256.1.JPG',
                'AJR-9364.1.JPG', 'AJR-9878.JPG', 'AJR-9969.JPG', 'AJR-9993.JPG'
            ],
            cst: [
                'AIR-36.JPG', 'AJR-3377.14.JPG', 'AJR-4011.11.JPG', 'AJR-5439.9.JPG',
                'AJR-6044.2.JPG', 'AJR-6695.2.JPG', 'AJR-6790.2.JPG', 'AJR-7218.4.JPG',
                'AJR-8458.1.JPG', 'AJR-8495.3.JPG', 'AJR-8894.1.JPG', 'AJR-8896.2.JPG',
                'AJR-9222.1.JPG', 'AJR-9304.1.JPG', 'AJR-9320.2.JPG', 'AJR-9512.2.JPG',
                'AJR-9542.JPG', 'AJR-9569.1.JPG', 'AJR-9763.JPG', 'AJR-9835.JPG',
                'AJR-9852.JPG'
            ],
            white: [
                'AIR-20.JPG', 'AIR-73.JPG', 'AJR-1160.1.JPG', 'AJR-2293.15.JPG',
                'AJR-2860.2.JPG', 'AJR-7060.3.JPG', 'AJR-8358.4.JPG', 'AJR-8789.2.JPG',
                'AJR-9018.1.JPG', 'AJR-9029.1.JPG', 'AJR-9139.1.JPG', 'AJR-9774.1.JPG',
                'AJR-9916.JPG', 'AJR-9918.JPG', 'AJR-9919.JPG', 'AJR-9973.JPG'
            ]
        };
        const labels = { color: 'Color Rings', cst: 'CST Rings', white: 'White Rings' };
        const requestedCategory = new URLSearchParams(window.location.search).get('category');
        const category = Object.hasOwn(ringCollections, requestedCategory) ? requestedCategory : 'all';
        const gallery = document.querySelector('#ring-gallery');
        const files = category === 'all'
            ? Object.entries(ringCollections).flatMap(([group, images]) => images.map((file) => ({ group, file })))
            : ringCollections[category].map((file) => ({ group: category, file }));

        document.querySelector('#ring-title').textContent = category === 'all'
            ? 'RINGS AND COLLECTIONS'
            : labels[category].toUpperCase();
        document.querySelectorAll('[data-ring-filter]').forEach((link) => {
            if (link.dataset.ringFilter === category) {
                link.setAttribute('aria-current', 'page');
            }
        });

        files.forEach(({ group, file }, index) => {
            const card = document.createElement('article');
            card.className = 'gallery-card';

            const image = document.createElement('img');
            image.className = 'gallery-image';
            image.src = `ring/${group}/${encodeURIComponent(file)}`;
            image.alt = `${labels[group]} design ${index + 1}`;
            image.loading = index === 0 ? 'eager' : 'lazy';

            const caption = document.createElement('div');
            caption.className = 'gallery-caption';
            const title = document.createElement('h2');
            title.textContent = `${labels[group]} · ${String(index + 1).padStart(2, '0')}`;

            caption.append(title);
            card.append(image, caption);
            gallery.append(card);
        });

    </script>
</body>
</html>
