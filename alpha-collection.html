<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Alpha Collection | ANAN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="logo" href="index.html" aria-label="ANAN home">
            <img src="Feature%20Images/logo_black.png" alt="">
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="collections.html">Collections</a>
            <a href="ring-collection.html">Rings</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="section-container collection-page local-collection-page vertical-collection-page">
        <div class="collection-actions">
            <a class="collection-action collection-back" href="index.html">← Back to Home</a>
            <a class="collection-action collection-enquiry-link" href="contact.html">Enquire Now</a>
        </div>
        <p class="eyebrow">ANAN FINE JEWELLERY</p>
        <h1 class="section-title">ALPHA</h1>
        <p class="collection-intro">Explore every piece in the Alpha collection.</p>
        <section class="collection-carousel" aria-label="Alpha collection gallery">
            <div class="gallery-viewport">
                <div class="gallery-track" id="alpha-gallery"></div>
            </div>
        </section>
    </main>

    <script>
        const alphaImages = [
            'AJBR-8256.1.JPG', 'AJBR-8257.1.JPG', 'AJBR-8258.JPG', 'AJBR-8259.2.JPG',
            'AJBR-8260.2.JPG', 'AJBR-8635.1.JPG', 'AJR-8261.1.JPG', 'AJR-8262.1.JPG',
            'AJR-8263.1.JPG', 'AJR-8264.1.JPG', 'AJR-8278.1.JPG', 'AJR-8662.JPG',
            'AJR-8673.JPG', 'AJR-9348.JPG'
        ];
        const alphaGallery = document.querySelector('#alpha-gallery');

        alphaImages.forEach((filename, index) => {
            const card = document.createElement('article');
            card.className = 'gallery-card';

            const image = document.createElement('img');
            image.className = 'gallery-image';
            image.src = `alpha/${encodeURIComponent(filename)}`;
            image.alt = `Alpha jewellery design ${index + 1}`;
            image.loading = index === 0 ? 'eager' : 'lazy';

            const caption = document.createElement('div');
            caption.className = 'gallery-caption';
            const title = document.createElement('h2');
            title.textContent = `Alpha Design ${String(index + 1).padStart(2, '0')}`;

            caption.append(title);
            card.append(image, caption);
            alphaGallery.append(card);
        });

    </script>
</body>
</html>
